name: StoryKit
options:
  bundleIdPrefix: com.steveshi
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  defaultConfig: Release

settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  PRODUCT_NAME: StoryKit
  GENERATE_INFOPLIST_FILE: YES
  CURRENT_PROJECT_VERSION: 1
  MARKETING_VERSION: "1.0.0"

targets:
  StoryKit:
    type: application
    platform: macOS
    sources:
      - path: StoryKit
        excludes:
          - "Resources/web"
      - path: StoryKit/Resources/web
        type: folder
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.steveshi.storykit
      PRODUCT_NAME: StoryKit
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleIconFile: AppIcon
      SWIFT_STRICT_CONCURRENCY: complete
      COMBINE_HIDPI_IMAGES: YES
      ENABLE_HARDENED_RUNTIME: YES
      INFOPLIST_KEY_CFBundleDisplayName: "StoryKit"
      INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Steve Shi. All rights reserved."
      INFOPLIST_KEY_CFBundleDocumentTypes:
        - CFBundleTypeName: "StoryKit World Project"
          CFBundleTypeRole: "Editor"
          LSHandlerRank: "Owner"
          LSItemContentTypes:
            - "com.steveshi.storykit.project"
            - "public.json"
      INFOPLIST_KEY_UTExportedTypeDeclarations:
        - UTTypeIdentifier: "com.steveshi.storykit.project"
          UTTypeDescription: "StoryKit World Project File"
          UTTypeConformsTo:
            - "public.json"
            - "public.data"
          UTTypeTagSpecification:
            public.filename-extension:
              - "storykit"
              - "carto"
